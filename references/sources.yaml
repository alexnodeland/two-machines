# Two Machines — reference directory
#
# THE single source of truth for every source the site cites or relies on.
# planning/12-references.md is the prose companion; this file is the data.
# /sources on the site is generated from this.
#
# Rule: if a claim is on the site, its source is in here. Exhaustively.
# That includes sources we cannot currently fetch — those carry
# fetch.status other than `ok` so the fetch script has a known target list
# to be improved against. Nothing is dropped for being inconvenient.
#
# Run `./fetch.sh` to build references/files/ locally.
# references/files/ is gitignored: this file and the script are the
# committed artefacts, the copies are reproducible from them.

meta:
  updated: 2026-08-12
  verified: 2026-08-11
  archive_dir: files
  # No hand-maintained counts here. They drifted within an hour of being
  # written, which is exactly the failure this directory exists to prevent.
  # `./fetch.sh --verify` reports live totals.

# fetch.status values
#   ok       — archived by curl, reproducible
#   browser  — archivable, but only via fetch-browser.mjs (JS-rendered page or
#              an interstitial that clears once JS runs). Still reproducible.
#   blocked  — a live URL that refuses automated fetch (bot check, 403).
#              Improvable: see fetch.hint.
#   manual   — cannot be fetched by script by nature (a book, a video,
#              a physical sleeve). Needs a human.
#   dead     — gone; use the Wayback snapshot in url_archive
#
# rights values
#   ours          — we wrote it
#   open-access   — free to read and mirror
#   third-party   — quote with attribution, do not republish
#   restricted    — quote sparingly; specific terms attached, see notes

sources:
